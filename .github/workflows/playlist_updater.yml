name: Run Duda Extractor and Save M3U

on:
  schedule:
    # Berjalan otomatis setiap jam pada menit ke-42
    - cron: "42 * * * *"
  # Pemicu manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # JALANKAN DUDA.PY
      # ============================================================
      - name: Run duda.py
        run: python duda.py

      # ============================================================
      # COMMIT & PUSH HASIL KE REPOSITORI
      # ============================================================
      - name: Commit and push generated M3U
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update M3U playlist from duda.py"
          # Pola '*.m3u' otomatis melacak file .m3u apa pun yang dihasilkan script
          file_pattern: "*.m3u"
