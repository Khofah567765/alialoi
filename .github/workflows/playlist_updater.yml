name: Combine and Check M3U Playlists

on:
  schedule:
    # Berjalan otomatis setiap jam pada menit ke-42
    - cron: "42 * * * *"
  # Memungkinkan pemicu manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps + Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp playwright curl_cffi
          playwright install --with-deps chromium

      # ============================================================
      # TAHAP EKSTRAKSI STREAM
      # ============================================================
      - name: Extract DAMITV streams
        run: python duda.py
        continue-on-error: true

      # ============================================================
      # PENGGABUNGAN DAN PENGECEKAN KUALITAS STREAM
      # ============================================================
      - name: Run combiner
        run: python combine_playlist.py

      - name: Check streams
        run: python check_playlist.py
        continue-on-error: true

      # ============================================================
      # COMMIT & PUSH HASIL KE REPOSITORI
      # ============================================================
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update combined and checked playlists"
          file_pattern: >-
            combined_events.m3u
            combined_events_checked.m3u
            flussi_non_funzionanti.txt
            damitv_events.m3u
            daddylive_streams.m3u
            cdnlivetv_channels.m3u
            cdnlivetv_events.m3u
