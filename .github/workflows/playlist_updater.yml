name: Run Duda Extractor and Save M3U

on:
  schedule:
    # Berjalan otomatis setiap jam pada menit ke-42
    - cron: "42 * * * *"
  # Pemicu manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow urllib3

      # Memastikan folder thumbnails selalu ada dengan placeholder
      - name: Ensure thumbnails directory exists
        run: |
          mkdir -p thumbnails
          touch thumbnails/.gitkeep

      # ============================================================
      # JALANKAN DUDA.PY
      # ============================================================
      - name: Run duda.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python duda.py

      # Cek file yang berubah sebelum commit
      - name: Check Git status
        run: |
          echo "=== Status File Git ==="
          git status --short
          echo "=== Isi Folder Thumbnails ==="
          ls -la thumbnails

      # ============================================================
      # COMMIT & PUSH HASIL KE REPOSITORI
      # ============================================================
      - name: Commit and push generated M3U & Thumbnails
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update M3U playlist and generated thumbnails"
          file_pattern: "*.m3u thumbnails/*"
